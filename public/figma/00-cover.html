<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Cover</title>
<link rel="stylesheet" href="tokens.css">
<style>
  body { width: 1920px; height: 960px; overflow: hidden; }
  .cover { width: 1920px; height: 960px; padding: 120px 140px; display: flex; flex-direction: column; justify-content: space-between;
           background: radial-gradient(circle at 20% 50%, rgba(20,184,166,.12) 0%, transparent 55%), var(--bg-primary); }
  .cover h1 { font-size: 120px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.05; margin-top: 28px; }
  .cover .t-lead { font-size: 28px; margin-top: 28px; max-width: 1100px; }
  .meta { display: flex; gap: 80px; border-top: 1px solid var(--border-color); padding-top: 40px; }
  .meta .t-footer-heading { margin-bottom: 10px; }
  .meta .v { font-size: 22px; font-weight: 500; }
  .status { display: inline-flex; align-items: center; gap: 10px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent-yellow); }
</style></head>
<body>
<div class="cover" id="Cover">
  <div>
    <div class="t-eyebrow" style="font-size:20px">hiro-labs.dev</div>
    <h1>Hiro Labs<br>Website</h1>
    <p class="t-lead">Marketing site design system and screens. Full-stack product studio.</p>
  </div>
  <div class="meta">
    <div><div class="t-footer-heading">Status</div><div class="v status"><span class="dot"></span>In progress</div></div>
    <div><div class="t-footer-heading">Owner</div><div class="v">Hiro Labs</div></div>
    <div><div class="t-footer-heading">Updated</div><div class="v">Oct 2026</div></div>
  </div>
</div>
</body></html>
