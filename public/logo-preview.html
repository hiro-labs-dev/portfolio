<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logo Options</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #e6edf3;
      padding: 40px;
    }
    
    h1 {
      margin-bottom: 40px;
      font-size: 24px;
      font-weight: 600;
    }
    
    .nav-demo {
      background: #0d1117;
      border-bottom: 1px solid #30363d;
      padding: 20px 48px;
      margin-bottom: 40px;
    }
    
    .nav-demo img {
      height: 24px;
      width: auto;
    }
    
    .option {
      margin-bottom: 16px;
    }
    
    .option-label {
      color: #7d8590;
      font-size: 14px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <h1>Logo Options - Pick Your Favorite</h1>
  
  <div class="option">
    <div class="option-label">Option 1: Expanding Blocks</div>
    <div class="nav-demo">
      <img src="/logo.svg" alt="hiro labs">
    </div>
  </div>
  
  <div class="option">
    <div class="option-label">Option 2: Layered Blocks</div>
    <div class="nav-demo">
      <img src="/logo-option2.svg" alt="hiro labs">
    </div>
  </div>
  
  <div class="option">
    <div class="option-label">Option 3: Connected Nodes</div>
    <div class="nav-demo">
      <img src="/logo-option3.svg" alt="hiro labs">
    </div>
  </div>
  
  <div class="option">
    <div class="option-label">Option 4: H Monogram</div>
    <div class="nav-demo">
      <img src="/logo-option4.svg" alt="hiro labs">
    </div>
  </div>
  
  <div class="option">
    <div class="option-label">Option 5: Grid Pattern</div>
    <div class="nav-demo">
      <img src="/logo-option5.svg" alt="hiro labs">
    </div>
  </div>
</body>
</html>
